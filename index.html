<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guías de matemática · Prof. Freddy Molina D.</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
:root{--bg:#f2f5f4;--card:#fff;--fg:#16302d;--muted:#566b68;--line:#d3dfdc;--accent:#0f5963;--warm:#e66b2e;
  --f-body:"Atkinson Hyperlegible",system-ui,sans-serif;--f-head:"Space Grotesk",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0f1918;--card:#172523;--fg:#e3eeec;--muted:#9bb0ad;--line:#2b3e3b;--accent:#5fb3b3;--warm:#f08a52;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:17px;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:32px max(16px,env(safe-area-inset-left)) 60px}
h1{font-family:var(--f-head);font-size:1.9rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 28px}
h2{font-family:var(--f-head);font-size:1rem;text-transform:uppercase;letter-spacing:.07em;color:var(--accent);margin:26px 0 10px}
.list{display:grid;gap:12px}
a.guide{display:flex;gap:14px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:16px 18px;color:inherit;text-decoration:none}
a.guide:hover,a.guide:focus-visible{border-color:var(--accent);outline:none}
.badge{flex:none;width:52px;height:52px;border-radius:10px;background:var(--accent);color:var(--card);display:grid;place-items:center;font-family:var(--f-head);font-weight:700}
.t{font-weight:700;font-size:1.05rem}
.d{color:var(--muted);font-size:.93rem}
.go{margin-left:auto;color:var(--warm);font-weight:700;white-space:nowrap}
footer{margin-top:36px;color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
<div class="wrap">
  <h1>Guías de matemática</h1>
  <p class="sub">Profesor: Freddy Molina D. · Colegio Instituto Pascal</p>

  <h2>2026 · II° medio B (222)</h2>
  <div class="list">
    <a class="guide" href="2026/222/">
      <span class="badge">M25</span>
      <span><span class="t">Superficies y volúmenes</span><br>
      <span class="d">Guía de estudio para la EC del Módulo 25: estudiar o hacer el ensayo de 45 minutos.</span></span>
      <span class="go">Abrir →</span>
    </a>
  </div>

  <footer>Tus respuestas se guardan solo en tu dispositivo.</footer>
</div>
</body>
</html>
